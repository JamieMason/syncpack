[package]
name = "syncpack-registry"
version = "15.3.3"
authors = ["Jamie Mason <jamie@foldleft.io>"]
edition = "2024"
description = "npm registry fetch + on-disk cache for syncpack"
license = "MIT"

[features]
# Exposes MockRegistryClient for downstream crates' tests.
test-support = []

[dependencies]
async-trait = "0.1.92"
indicatif = "0.18.6"
log = "0.4.33"
reqwest = { version = "0.12", features = [
  "json",
  "rustls-tls",
], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
syncpack-io = { path = "../syncpack-io" }
syncpack-specifier = { path = "../syncpack-specifier" }
syncpack-vocab = { path = "../syncpack-vocab" }
thiserror = "2.0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }

[dev-dependencies]
syncpack-io = { path = "../syncpack-io", features = ["test-support"] }
